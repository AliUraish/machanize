project:
  name: blue-object-to-glass-demo
  sdk: machanize
  description: Pick up a blue object and place it inside a glass.

robot:
  framework: lerobot
  type: so101
  camera_names:
    - front
    - wrist
  cameras:
    front:
      device: /dev/video0
      width: 640
      height: 480
    wrist:
      device: /dev/video2
      width: 640
      height: 480

task:
  objects:
    - blue_object
    - glass
    - gripper
  success:
    - blue_object_is_inside_glass
  states:
    - normal
    - missed_blue_object
    - blue_object_dropped
    - wrong_direction
    - stuck

training:
  sequence_seconds: 2
  require_human_approval: false
  validation:
    new_untrained_episodes: 1

analysis:
  source_outcome: success_or_user_confirmed_unknown
  required_cameras:
    - front
    - wrist
  video_layout: side_by_side
  video_fps: 5
  model: gemini-robotics-er-1.6-preview
  api: generateContent
  require_human_approval: true
  auto_approve: false

perception:
  frame_extraction_stride: 1
  grounding_dino:
    model: IDEA-Research/grounding-dino-tiny
    confidence_threshold: 0.50
    auto_approve: true
  yolo:
    base_model: yolo26n.pt
    image_size: 640
    epochs: 50
    confidence_threshold: 0.25

recording:
  fps: 30
  default_episode_seconds: 30
  dataset_repo_id: machanize/blue-object-to-glass

runtime:
  default_mode: "off"
  live_model: gemini-3.1-flash-live-preview
  control_fps: 30
  monitor_sample_fps: 5
  control_watchdog_seconds: 5
  front_camera_key: front
  wrist_camera_key: wrist
  joint_state_key: observation.state
  cloud_timeout_seconds: 4
  recommendation_window_seconds: 4
  active_enabled: false
  modes:
    - "off"
    - monitor
    - active
  alert_threshold: 0.60
  stop_threshold: 0.85
  consecutive_high_risk_predictions: 3
  fail_safe_on_inference_error: true

storage:
  mode: local
  episode_directory: data/episodes
  label_directory: data/labels
  model_directory: models
