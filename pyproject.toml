[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "machanize"
version = "0.1.0"
description = "A supervisory monitoring SDK for frozen robot policies"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
lerobot = [
  "lerobot[dataset,feetech]>=0.6.1,<0.7",
]
vision = [
  "fastapi>=0.115,<1.0",
  "google-genai>=1.0,<2.0",
  "pillow>=11.0,<13.0",
  "python-multipart>=0.0.20,<1.0",
  "timm>=1.0,<2.0",
  "transformers>=4.57,<6.0",
  "ultralytics>=8.4,<9.0",
  "uvicorn[standard]>=0.34,<1.0",
]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.0,<10.0",
  "ruff>=0.9,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/machanize"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
